name: Staging Smoke Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      smoke_url:
        description: 'Staging base URL (e.g. http://your-vps:5000)'
        required: false
        default: 'http://localhost:5000'

concurrency:
  group: staging-smoke-${{ github.ref }}
  cancel-in-progress: true  # Newer push supersedes pending smoke

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # Step 1: Check staging config AND whether code actually changed
  check-config:
    name: Check Staging Config
    runs-on: ubuntu-latest
    outputs:
      has_url: ${{ steps.check.outputs.has_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Detect code changes (skip docs-only pushes)
        id: paths
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name != 'pull_request' && (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch) || '' }}
          filters: |
            code:
              - 'server/**'
              - 'nerves/workers/trading/**'
              - 'vbs/**'
              - 'Dockerfile'

      - name: Check if staging smoke should run
        id: check
        env:
          STAGING_URL: ${{ secrets.STAGING_BASE_URL }}
          HAS_CODE: ${{ steps.paths.outputs.code }}
        run: |
          DISPATCH="${{ github.event_name }}"
          # workflow_dispatch always runs (manual trigger)
          if [ "$DISPATCH" = "workflow_dispatch" ]; then
            echo "has_url=true" >> $GITHUB_OUTPUT
            exit 0
          fi
          # Skip on docs-only pushes
          if [ "$HAS_CODE" = "false" ]; then
            echo "has_url=false" >> $GITHUB_OUTPUT
            echo "⏭️  Docs-only push — skipping staging smoke test."
            exit 0
          fi
          # Require STAGING_BASE_URL secret for push triggers
          if [ -n "$STAGING_URL" ]; then
            echo "has_url=true" >> $GITHUB_OUTPUT
          else
            echo "has_url=false" >> $GITHUB_OUTPUT
            echo "⚠️ STAGING_BASE_URL secret not set — skipping smoke tests."
          fi

  staging-smoke:
    name: Staging Smoke HTTP
    needs: check-config
    if: needs.check-config.outputs.has_url == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SMOKE_BASE_URL: ${{ secrets.STAGING_BASE_URL || github.event.inputs.smoke_url || 'http://localhost:5000' }}
      WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create server symlink
        run: ln -s nerves/workers/trading server

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compute weekly cache key
        id: uv-cache
        run: echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Cache uv packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ steps.uv-cache.outputs.week }}-${{ hashFiles('nerves/workers/trading/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ steps.uv-cache.outputs.week }}-
            ${{ runner.os }}-uv-

      - name: Install test dependencies
        run: |
          pip install uv
          uv pip install --system -r server/requirements.txt
          uv pip install --system -r server/requirements-test.txt

      - name: Run Staging Smoke Tests
        run: |
          cd server
          echo "🌐 Smoke testing: $SMOKE_BASE_URL"
          python -m pytest tests/integration/test_staging_smoke.py \
            -m staging --tb=short -v \
            --timeout=30

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚨 Staging Smoke FAILED on ${SHORT_SHA} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -d "parse_mode=Markdown" || true
          fi

  staging-smoke-fallback:
    name: Staging Smoke Fallback
    needs: check-config
    if: needs.check-config.outputs.has_url == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create server symlink
        run: ln -s nerves/workers/trading server

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compute weekly cache key
        id: uv-cache
        run: echo "week=$(date -u +%Y-W%V)" >> $GITHUB_OUTPUT

      - name: Cache uv packages
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ steps.uv-cache.outputs.week }}-${{ hashFiles('nerves/workers/trading/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-${{ steps.uv-cache.outputs.week }}-
            ${{ runner.os }}-uv-

      - name: Install dependencies
        run: |
          pip install uv
          uv pip install --system -r server/requirements.txt
          uv pip install --system -r server/requirements-test.txt

      - name: Run Fallback Pipeline Simulation
        run: |
          python scripts/simulate_pipeline.py

      - name: Notify Telegram on Failure
        if: failure()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$TELEGRAM_BOT_TOKEN" ] && [ -n "$TELEGRAM_CHAT_ID" ]; then
            SHORT_SHA=$(echo "${{ github.sha }}" | head -c 7)
            curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -d "chat_id=${TELEGRAM_CHAT_ID}" \
              -d "text=🚨 Staging Smoke Fallback FAILED on ${SHORT_SHA} — ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
              -d "parse_mode=Markdown" || true
          fi
