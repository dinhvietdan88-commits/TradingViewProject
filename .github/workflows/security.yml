# ╔══════════════════════════════════════════════╗
# ║  ANGATI SECURITY GATE — GitHub Code Scanning ║
# ║  Triggers: push/PR to main + weekly schedule ║
# ╚══════════════════════════════════════════════╝
name: Security & Code Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Weekly deep scan — every Monday at 02:00 UTC
    - cron: "0 2 * * 1"
  workflow_dispatch:
    inputs:
      scan_level:
        description: "Scan level (quick | full)"
        required: false
        default: "full"

concurrency:
  group: security-${{ github.ref }}
  cancel-in-progress: false   # Security scans must complete

permissions:
  actions: read
  contents: read
  security-events: write      # Required to upload SARIF results

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 0. PRE-CHECK: Skip entirely on docs-only changes ──────────────
  # Saves 4 runners on every push that only touches docs/pine/scratch.
  # Weekly schedule always runs (no path filter on cron).
  check-code-changed:
    name: "Check — Code Changed?"
    runs-on: ubuntu-latest
    outputs:
      has_code: ${{ steps.filter.outputs.code }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Detect code changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ github.event_name != 'pull_request' && (github.event.before && github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.event.repository.default_branch) || '' }}
          filters: |
            code:
              - 'server/**'
              - 'nerves/workers/trading/**'
              - 'vbs/**'
              - 'Dockerfile'
              - 'vbs/Dockerfile'
              - 'requirements*.txt'

  # ── 1. CODEQL ANALYSIS ──────────────────────────────────────────
  codeql:
    name: CodeQL Analysis (Python)
    needs: check-code-changed
    if: |
      needs.check-code-changed.outputs.has_code == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 2       # Required for CodeQL to detect changes

      - name: Create server symlink
        run: |
          if [ ! -d "server" ] && [ -d "nerves/workers/trading" ]; then
            ln -s nerves/workers/trading server
          fi

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: +security-extended,security-and-quality
          config: |
            paths:
              - server
              - trading
            paths-ignore:
              - server/.venv
              - server/chroma_db
              - '**/__pycache__'
              - '**/*.pyc'

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      # Auto-build step (CodeQL auto-detects Python — no explicit build needed)
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:python"
          output: sarif-results
          upload: true

  # ── 2. DEPENDENCY VULNERABILITY AUDIT ───────────────────────────
  dependency-audit:
    name: Dependency Vulnerability Audit
    needs: check-code-changed
    if: |
      needs.check-code-changed.outputs.has_code == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Audit server/requirements.txt
        run: |
          echo "🔍 Auditing server/requirements.txt..."
          pip-audit -r nerves/workers/trading/requirements.txt \
            --format=json \
            --output=audit-server.json \
            --ignore-vuln PYSEC-2022-42969 \
            || true

          echo "🔍 Auditing server/requirements-test.txt..."
          pip-audit -r nerves/workers/trading/requirements-test.txt \
            --format=json \
            --output=audit-test.json \
            || true

          # Print human-readable summary
          pip-audit -r nerves/workers/trading/requirements.txt || true

      - name: Upload audit reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: dependency-audit-${{ github.run_id }}
          path: |
            audit-server.json
            audit-test.json
          retention-days: 30

  # ── 3. ANGATI INTERNAL SECURITY SCAN (AST-based) ────────────────
  angati-security-scan:
    name: Angati Internal Security Scan
    needs: check-code-changed
    if: |
      needs.check-code-changed.outputs.has_code == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Ruff + Bandit
        run: pip install ruff bandit[toml]

      - name: Create server symlink (repo layout compatibility)
        run: |
          if [ ! -d "server" ] && [ -d "nerves/workers/trading" ]; then
            ln -s nerves/workers/trading server
          fi

      - name: Ruff Security-Relevant Lint (E, S rules)
        run: |
          echo "=== Ruff Lint Report ===" | tee ruff-report.txt
          ruff check server/ \
            --select E,W,S,B,A,C4,T20 \
            --output-format=github \
            --exit-zero | tee -a ruff-report.txt

      - name: Bandit SAST (AST security patterns)
        run: |
          echo "=== Bandit SAST Report ===" | tee bandit-report.txt
          bandit -r server/ \
            -x server/.venv,server/chroma_db,server/__pycache__ \
            -f txt \
            --severity-level medium \
            -o bandit-report.txt \
            || true
          cat bandit-report.txt

      - name: Angati Internal Security CLI
        run: |
          echo "=== Angati Security CLI ===" | tee angati-sec.txt
          cd server && python -m security.cli scan 2>&1 | tee -a ../angati-sec.txt || \
            echo "⚠️  security.cli not available in CI — skipping internal scan"

      - name: Upload security scan reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: angati-security-reports-${{ github.run_id }}
          path: |
            ruff-report.txt
            bandit-report.txt
            angati-sec.txt
          retention-days: 30

  # ── 4. SECRET DETECTION ─────────────────────────────────────────
  secret-scan:
    name: Secret Detection (TruffleHog)
    needs: check-code-changed
    if: |
      needs.check-code-changed.outputs.has_code == 'true' ||
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0       # Full history needed for secret scanning

      - name: TruffleHog OSS Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: >-
            --only-verified
            --exclude-paths=.trufflehogignore

      - name: Check for .env files committed by mistake
        run: |
          echo "Checking for accidentally committed secrets..."
          # Warn if any .env file (not .env.example) is tracked
          TRACKED=$(git ls-files | grep -E '\.env$' | grep -v '\.env\.example' || true)
          if [ -n "$TRACKED" ]; then
            echo "⚠️  WARNING: The following .env files are tracked by git:"
            echo "$TRACKED"
            echo "Remove them with: git rm --cached <file>"
          else
            echo "✅ No .env files tracked — clean"
          fi

  # ── 5. SECURITY GATE SUMMARY ────────────────────────────────────
  security-gate:
    name: Security Gate (Pass/Fail)
    runs-on: ubuntu-latest
    needs: [check-code-changed, codeql, dependency-audit, angati-security-scan, secret-scan, codeql-sarif-gate]
    if: always()

    steps:
      - name: Evaluate Gate
        run: |
          echo "============================================"
          echo "  ANGATI SECURITY GATE — RESULTS SUMMARY"
          echo "============================================"
          echo "CodeQL:             ${{ needs.codeql.result }}"
          echo "CodeQL SARIF Gate:  ${{ needs.codeql-sarif-gate.result }}"
          echo "Dependency Audit:   ${{ needs.dependency-audit.result }}"
          echo "Angati Sec Scan:    ${{ needs.angati-security-scan.result }}"
          echo "Secret Scan:        ${{ needs.secret-scan.result }}"
          echo "============================================"

          # Fail if CodeQL SARIF gate fails (Critical findings > 0)
          if [ "${{ needs.codeql-sarif-gate.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: CodeQL SARIF gate detected Critical findings."
            exit 1
          fi
          # Fail if CodeQL analysis itself fails (infrastructure issue)
          if [ "${{ needs.codeql.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: CodeQL analysis job failed."
            exit 1
          fi
          if [ "${{ needs.secret-scan.result }}" = "failure" ]; then
            echo "❌ GATE FAILED: Secrets detected in repository."
            exit 1
          fi
          echo "✅ Security gate PASSED."

  # ── 6. SEC-4 CODEQL SARIF GATE (Critical = 0 enforcer) ──────────────────
  codeql-sarif-gate:
    name: "SEC-4 CodeQL SARIF Gate (Critical=0)"
    runs-on: ubuntu-latest
    needs: [codeql]
    if: |
      always() &&
      (needs.codeql.result == 'success' || needs.codeql.result == 'skipped')
    permissions:
      actions: read
      contents: read
      security-events: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install jq for SARIF parsing
        run: sudo apt-get install -y jq

      # Download SARIF from the CodeQL job artifact (best-effort)
      - name: Download CodeQL SARIF results
        uses: actions/download-artifact@v4
        with:
          name: codeql-results-python
          path: sarif-results/
        continue-on-error: true

      # Parse SARIF and count by severity
      - name: Parse SARIF — Count findings by severity
        id: sarif-parse
        run: |
          set -euo pipefail

          SARIF_FILE=""
          if ls sarif-results/*.sarif 2>/dev/null | head -1; then
            SARIF_FILE=$(ls sarif-results/*.sarif | head -1)
          fi

          if [ -z "$SARIF_FILE" ]; then
            echo "⚠️  No SARIF artifact found — gate deferred (CodeQL may have skipped)"
            echo "critical_count=0" >> "$GITHUB_OUTPUT"
            echo "high_count=0" >> "$GITHUB_OUTPUT"
            echo "total_count=0" >> "$GITHUB_OUTPUT"
            echo "sarif_available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "📂 Parsing: $SARIF_FILE"

          # Count findings using jq (SARIF spec: level=error means critical/error)
          CRITICAL=$(jq '[.runs[].results[] | select(.level == "error")] | length' "$SARIF_FILE" 2>/dev/null || echo "0")
          HIGH=$(jq '[.runs[].results[] | select(.level == "warning")] | length' "$SARIF_FILE" 2>/dev/null || echo "0")
          TOTAL=$(jq '[.runs[].results[]] | length' "$SARIF_FILE" 2>/dev/null || echo "0")

          echo "critical_count=$CRITICAL" >> "$GITHUB_OUTPUT"
          echo "high_count=$HIGH" >> "$GITHUB_OUTPUT"
          echo "total_count=$TOTAL" >> "$GITHUB_OUTPUT"
          echo "sarif_available=true" >> "$GITHUB_OUTPUT"
          echo "🔍 SARIF: Critical=$CRITICAL | High=$HIGH | Total=$TOTAL"

      # GitHub Step Summary
      - name: Post Step Summary
        if: always()
        run: |
          CRITICAL="${{ steps.sarif-parse.outputs.critical_count || '0' }}"
          HIGH="${{ steps.sarif-parse.outputs.high_count || '0' }}"
          TOTAL="${{ steps.sarif-parse.outputs.total_count || '0' }}"

          if [ "$CRITICAL" = "0" ]; then
            ICON="✅"; STATUS="PASSED — No Critical findings"
          else
            ICON="❌"; STATUS="FAILED — $CRITICAL Critical finding(s)"
          fi

          cat >> "$GITHUB_STEP_SUMMARY" << SUMMARY
          # 🛡️ SEC-4 CodeQL SARIF Gate

          **Result:** $ICON $STATUS

          | Severity | Count | Policy |
          |----------|-------|--------|
          | 🔴 Critical | $CRITICAL | Block merge if > 0 |
          | 🟠 High | $HIGH | Warning |
          | 📊 Total | $TOTAL | |

          **SEC-4 Runtime Guard Active:**
          - CWE-918 SSRF → \`security.runtime_guard.validate_exchange_url\`
          - CWE-22 Path Traversal → \`security.runtime_guard.safe_path\`
          - CWE-400 ReDoS → \`security.runtime_guard.safe_regex_input\`
          SUMMARY

      # Upload gate report artifact
      - name: Generate and upload gate report
        if: always()
        run: |
          mkdir -p sec4-report
          cat > sec4-report/gate_report.md << REPORT
          # SEC-4 Gate Report
          Run: ${{ github.run_id }}
          Commit: ${{ github.sha }}
          Critical: ${{ steps.sarif-parse.outputs.critical_count || 'N/A' }}
          High: ${{ steps.sarif-parse.outputs.high_count || 'N/A' }}
          Total: ${{ steps.sarif-parse.outputs.total_count || 'N/A' }}
          REPORT

      - name: Upload SEC-4 gate report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sec4-gate-report-${{ github.run_id }}
          path: sec4-report/
          retention-days: 30

      # HARD FAIL: exit 1 if Critical > 0
      - name: Enforce Critical = 0 (Hard Gate)
        run: |
          CRITICAL="${{ steps.sarif-parse.outputs.critical_count || '0' }}"
          echo "Critical count: $CRITICAL"
          if [ "$CRITICAL" != "0" ] && [ -n "$CRITICAL" ]; then
            echo "╔══════════════════════════════════════════════╗"
            echo "║  ❌ SEC-4 GATE FAILED: $CRITICAL CRITICAL   ║"
            echo "║  Fix before merging — see Security tab       ║"
            echo "╚══════════════════════════════════════════════╝"
            exit 1
          fi
          echo "╔══════════════════════════════════════════════╗"
          echo "║  ✅ SEC-4 GATE PASSED: Zero Critical         ║"
          echo "╚══════════════════════════════════════════════╝"
