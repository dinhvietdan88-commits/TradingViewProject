name: CI/CD Production Pipeline

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

# All actions upgraded to Node.js 24 native versions (setup-python@v6, checkout@v6, cache@v5)

jobs:
  # ── 0. CHANGE DETECTION ────────────────────────────────────────────
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deploy: ${{ steps.filter.outputs.deploy }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            code:
              - 'nerves/workers/trading/**'
              - 'vbs/**'
              - 'Dockerfile'
              - 'pine/**'
              - '.github/workflows/**'
            deploy:
              - 'nerves/workers/trading/**'
              - 'Dockerfile'
              - 'deploy/**'
              - 'vbs/**'
              - '.github/workflows/**'

  # ── 1A. LINT & SECURITY (Fast ~15s — zero pip install) ───────────
  ci-lint-security:
    name: Lint & Security Scan
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Create server symlink
        run: ln -s nerves/workers/trading server

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Code Linting (Ruff)
        run: pipx run ruff check server/ --exit-zero

      - name: Security AST Scan
        run: |
          cd server
          python -m security.cli scan || echo "Warning: Review security scan report"

  # ── 1B. ORGANIZED TEST SUITE (2 Parallel Runners) ──────────────────
  # Runner 1 (Fast):    Unit + Property + Integration + System (540 tests)
  # Runner 2 (Browser): E2E + Security (35 tests)
  # Both run IN PARALLEL — only 2 installs instead of 4.
  ci-tests:
    name: "Test: ${{ matrix.stage }}"
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - stage: "Fast (Unit + Integration + System)"
            paths: "tests/unit/ tests/property/ tests/integration/ __auto_root__"
            parallel: true
            install-browser: false
          - stage: "Browser (E2E + Security)"
            paths: "tests/e2e/ tests/security/"
            parallel: false
            install-browser: true
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      # Hash source code để bypass nếu test đã pass cho code giống hệt
      - name: Compute code hash for test cache
        id: code-hash
        run: |
          CODE_HASH=$(find nerves/workers/trading -type f -name '*.py' | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "hash=$CODE_HASH" >> $GITHUB_OUTPUT

      - name: Check test result cache
        id: test-cache
        uses: actions/cache@v5
        with:
          path: .test-passed
          key: test-passed-${{ matrix.stage }}-${{ steps.code-hash.outputs.hash }}

      - name: Skip tests (cache hit)
        if: steps.test-cache.outputs.cache-hit == 'true'
        run: echo "⚡ [${{ matrix.stage }}] Tests already passed for this code hash."

      - name: Create server symlink
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: ln -s nerves/workers/trading server

      - name: Set up Python 3.11
        if: steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install uv (fast pip)
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: pip install uv

      - name: Cache uv packages
        if: steps.test-cache.outputs.cache-hit != 'true'
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: ${{ runner.os }}-uv-${{ hashFiles('nerves/workers/trading/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-uv-

      - name: Install Dependencies
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: |
          uv pip install --system -r server/requirements.txt
          uv pip install --system -r server/requirements-test.txt

      - name: Cache Playwright browsers
        if: steps.test-cache.outputs.cache-hit != 'true' && matrix.install-browser == true
        id: playwright-cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('nerves/workers/trading/requirements*.txt') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright Chromium Browser
        if: steps.test-cache.outputs.cache-hit != 'true' && steps.playwright-cache.outputs.cache-hit != 'true' && matrix.install-browser == true
        run: python -m playwright install chromium

      - name: "Run Tests: ${{ matrix.stage }}"
        if: steps.test-cache.outputs.cache-hit != 'true'
        env:
          VPS_BUFFER_ENABLED: "false"
          CHROMA_REMOTE: "false"
        run: |
          cd server
          # Resolve test paths (expand __auto_root__ to root-level test files)
          RAW_PATHS="${{ matrix.paths }}"
          if echo "$RAW_PATHS" | grep -q '__auto_root__'; then
            ROOT_FILES=$(find tests/ -maxdepth 1 -name 'test_*.py' | sort | tr '\n' ' ')
            TEST_PATHS=$(echo "$RAW_PATHS" | sed "s|__auto_root__|$ROOT_FILES|")
          else
            TEST_PATHS="$RAW_PATHS"
          fi

          # Auto-count tests
          COUNT=$(python -m pytest $TEST_PATHS --collect-only -q 2>/dev/null | tail -1 | grep -oP '\d+(?= tests?)' || echo "?")
          echo "🧪 [${{ matrix.stage }}] Running $COUNT tests"

          # Run with or without parallelism
          if [ "${{ matrix.parallel }}" = "true" ]; then
            python -m pytest $TEST_PATHS -x -n auto --dist worksteal --tb=short -q
          else
            python -m pytest $TEST_PATHS -x --tb=short -q
          fi

      - name: Mark tests passed for cache
        if: steps.test-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .test-passed
          echo "${{ steps.code-hash.outputs.hash }}" > .test-passed/hash.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .test-passed/timestamp.txt

  # ── 1C. BUILD & PUSH DOCKER IMAGES (GHCR Cache Optimization) ─────
  build-images:
    name: Build & Push Docker Images
    needs: [changes, ci-lint-security, ci-tests]
    if: |
      always() &&
      (needs.changes.outputs.deploy == 'true' || contains(github.event.head_commit.message, '[force deploy]')) &&
      (needs.ci-lint-security.result == 'success' || needs.ci-lint-security.result == 'skipped') &&
      (needs.ci-tests.result == 'success' || needs.ci-tests.result == 'skipped')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push VBS Image
        uses: docker/build-push-action@v5
        with:
          context: ./vbs
          file: ./vbs/Dockerfile
          push: true
          tags: ghcr.io/dinhvietdan88-commits/tradingbot-vbs:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and Push Execution & Analyzer Images
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/dinhvietdan88-commits/tradingbot-analyzer:latest
            ghcr.io/dinhvietdan88-commits/tradingbot-execution:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run Trivy vulnerability scanner on VBS Image
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: 'ghcr.io/dinhvietdan88-commits/tradingbot-vbs:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Run Trivy vulnerability scanner on Runtime Image
        uses: aquasecurity/trivy-action@0.28.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: 'ghcr.io/dinhvietdan88-commits/tradingbot-analyzer:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

  # ── 2A. DEPLOY SERVER A (Gateway) ──────────────────────────────────
  deploy-server-a:
    name: Deploy Server A (Gateway)
    needs: [changes, ci-lint-security, ci-tests, build-images]
    if: |
      always() &&
      (needs.changes.outputs.deploy == 'true' || contains(github.event.head_commit.message, '[force deploy]')) &&
      (needs.ci-lint-security.result == 'success' || needs.ci-lint-security.result == 'skipped') &&
      (needs.ci-tests.result == 'success' || needs.ci-tests.result == 'skipped') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan SSH Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_A_IP }} >> ~/.ssh/known_hosts || true

      - name: Pre-check SSH connectivity
        id: ssh_check_a
        run: |
          echo "🔌 Testing SSH to Server A..."
          if ssh -o ConnectTimeout=10 -o BatchMode=yes botuser@${{ secrets.SERVER_A_IP }} "echo ok" 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Server A reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server A unreachable — skipping deploy"
          fi

      - name: Deploy Server A
        id: deploy_a
        if: steps.ssh_check_a.outputs.reachable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "🚀 Deploying Server A..."
          ssh botuser@${{ secrets.SERVER_A_IP }} "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' bash -s" << 'EOF'
            set -e
            cd /opt/trading-bot
            git reset --hard origin/main
            OLD_SHA=$(git rev-parse HEAD)
            echo "$OLD_SHA" > .rollback_sha
            git fetch origin
            git checkout main
            PULL_OUTPUT=$(git pull origin main 2>&1)
            echo "$PULL_OUTPUT"
            NEW_SHA=$(git rev-parse HEAD)
            
            # Backup database if container is running
            if docker ps --format '{{.Names}}' | grep -q "^tradingbot-vbs$"; then
              echo "📦 Backing up SQLite database..."
              docker cp tradingbot-vbs:/app/data/signal_queue.db /tmp/signal_queue.db.bak || true
            else
              # Fallback to local files
              for path in "/opt/trading-bot/vbs/data/signal_queue.db" "/opt/trading-bot/vbs/signal_queue.db" "/opt/trading-bot/signal_queue.db"; do
                if [ -f "$path" ]; then
                  echo "📦 Backing up local database file: $path"
                  cp "$path" /tmp/signal_queue.db.bak
                  break
                fi
              done
            fi
            
            # Nếu code không đổi → skip pull & restart, health check only
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "📎 No new commits — skipping pull"
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                echo "✅ Server A already healthy (no changes)"
                rm -f /tmp/signal_queue.db.bak
                exit 0
              fi
              echo "⚠️ No changes but service unhealthy — restarting..."
            fi
            
            # Đánh dấu đã deploy (cho rollback logic)
            echo "DEPLOYED" > /tmp/.deploy_state
            
            # Login to GHCR, pull and update container, then logout
            echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
            docker compose -f deploy/docker-compose.server-a.yml pull
            docker compose -f deploy/docker-compose.server-a.yml up -d
            docker logout ghcr.io
            
            # Restore/Import database from backup if it exists
            if [ -f /tmp/signal_queue.db.bak ]; then
              echo "📦 Restoring database into container..."
              docker cp /tmp/signal_queue.db.bak tradingbot-vbs:/app/data/signal_queue.db || true
              docker compose -f deploy/docker-compose.server-a.yml restart
            fi
            
            echo "🔍 Testing Gateway Health..."
            for i in {1..10}; do
              if curl -sf http://localhost:5000/health > /dev/null; then
                echo "✅ Server A Healthy!"
                rm -f /tmp/signal_queue.db.bak
                exit 0
              fi
              sleep 2
            done
            echo "❌ Server A Health Check Failed!"
            exit 1
          EOF
      - name: Post-Deploy Smoke Test (External Routing)
        id: smoke_a
        if: steps.deploy_a.outcome == 'success'
        run: |
          echo "🔌 Testing Tailscale network connectivity to Server A..."
          for i in {1..10}; do
            if curl -sf --connect-timeout 5 http://${{ secrets.SERVER_A_IP }}:5000/health; then
              echo "✅ Tailscale Network Smoke Test Passed!"
              exit 0
            fi
            echo "⏳ Retrying Tailscale connection..."
            sleep 3
          done
          echo "❌ Tailscale Network Smoke Test Failed!"
          exit 1

      - name: Rollback Server A (On Failure)
        if: failure() && steps.ssh_check_a.outputs.reachable == 'true'
        run: |
          echo "⚠️ Checking if rollback is needed..."
          ssh botuser@${{ secrets.SERVER_A_IP }} 'bash -s' << 'EOF'
            cd /opt/trading-bot
            if [ ! -f .rollback_sha ]; then
              echo "⏭️ No rollback SHA — nothing to revert"
              exit 0
            fi
            CURRENT_SHA=$(git rev-parse HEAD)
            ROLLBACK_SHA=$(cat .rollback_sha)
            if [ "$CURRENT_SHA" = "$ROLLBACK_SHA" ]; then
              echo "⏭️ Code unchanged — rollback not needed"
              exit 0
            fi
            echo "🔄 Reverting Server A to $ROLLBACK_SHA..."
            git checkout $ROLLBACK_SHA
            docker compose -f deploy/docker-compose.server-a.yml up -d
            
            # Restore database backup if it exists
            if [ -f /tmp/signal_queue.db.bak ]; then
              echo "📦 Restoring database backup..."
              docker cp /tmp/signal_queue.db.bak tradingbot-vbs:/app/data/signal_queue.db || true
              docker compose -f deploy/docker-compose.server-a.yml restart
              rm -f /tmp/signal_queue.db.bak
            fi
            echo "✅ Rollback Server A completed"
          EOF

  # ── 2B. DEPLOY SERVER C (AI Core) ──────────────────────────────────
  deploy-server-c:
    name: Deploy Server C (AI Core)
    needs: [changes, ci-lint-security, ci-tests, build-images]
    if: |
      always() &&
      (needs.changes.outputs.deploy == 'true' || contains(github.event.head_commit.message, '[force deploy]')) &&
      (needs.ci-lint-security.result == 'success' || needs.ci-lint-security.result == 'skipped') &&
      (needs.ci-tests.result == 'success' || needs.ci-tests.result == 'skipped') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan SSH Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_C_IP }} >> ~/.ssh/known_hosts || true

      - name: Pre-check SSH connectivity
        id: ssh_check_c
        run: |
          echo "🔌 Testing SSH to Server C..."
          if ssh -o ConnectTimeout=10 -o BatchMode=yes botuser@${{ secrets.SERVER_C_IP }} "echo ok" 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Server C reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server C unreachable — skipping deploy"
          fi

      - name: Deploy Server C
        id: deploy_c
        if: steps.ssh_check_c.outputs.reachable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
        run: |
          echo "🚀 Deploying Server C..."
          ssh botuser@${{ secrets.SERVER_C_IP }} "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' bash -s" << 'EOF'
            set -e
            DEPLOY_DIR="/opt/trading-bot"
            [ ! -d "$DEPLOY_DIR/.git" ] && DEPLOY_DIR="/home/botuser/trading-bot"
            cd "$DEPLOY_DIR"
            git reset --hard origin/main
            OLD_SHA=$(git rev-parse HEAD)
            echo "$OLD_SHA" > .rollback_sha
            git fetch origin
            git checkout main
            PULL_OUTPUT=$(git pull origin main 2>&1)
            echo "$PULL_OUTPUT"
            NEW_SHA=$(git rev-parse HEAD)
            
            # Nếu code không đổi → skip pull & restart, health check only
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "📎 No new commits — skipping pull"
              if curl -sf http://localhost:8000/api/v2/heartbeat > /dev/null 2>&1; then
                echo "✅ Server C already healthy (no changes)"
                exit 0
              fi
              echo "⚠️ No changes but service unhealthy — restarting..."
            fi
            
            if [ -f deploy/docker-compose.server-c.yml ]; then
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
              docker compose -f deploy/docker-compose.server-c.yml pull
              docker compose -f deploy/docker-compose.server-c.yml up -d
              docker logout ghcr.io
            fi
            
            echo "🔍 Testing Server C Health..."
            for i in {1..30}; do
              CHROMA_OK=false
              ANALYZER_OK=false
              
              if curl -sf http://localhost:8000/api/v2/heartbeat > /dev/null 2>&1; then
                CHROMA_OK=true
              fi
              
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' tradingbot-analyzer 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                ANALYZER_OK=true
              fi
              
              if [ "$CHROMA_OK" = true ] && [ "$ANALYZER_OK" = true ]; then
                echo "✅ Server C is fully healthy! (ChromaDB + Analyzer OK)"
                exit 0
              fi
              
              echo "⏳ Waiting for services (ChromaDB: $CHROMA_OK, Analyzer: $STATUS)..."
              sleep 3
            done
            
            echo "❌ Server C Health Check Failed! (ChromaDB: $CHROMA_OK, Analyzer: $STATUS)"
            exit 1
          EOF

      - name: Rollback Server C (On Failure)
        if: failure() && steps.deploy_c.outcome == 'failure' && steps.ssh_check_c.outputs.reachable == 'true'
        run: |
          echo "⚠️ Checking if rollback is needed..."
          ssh botuser@${{ secrets.SERVER_C_IP }} 'bash -s' << 'EOF'
            DEPLOY_DIR="/opt/trading-bot"
            [ ! -d "$DEPLOY_DIR/.git" ] && DEPLOY_DIR="/home/botuser/trading-bot"
            cd "$DEPLOY_DIR"
            if [ ! -f .rollback_sha ]; then
              echo "⏭️ No rollback SHA — nothing to revert"
              exit 0
            fi
            CURRENT_SHA=$(git rev-parse HEAD)
            ROLLBACK_SHA=$(cat .rollback_sha)
            if [ "$CURRENT_SHA" = "$ROLLBACK_SHA" ]; then
              echo "⏭️ Code unchanged — rollback not needed"
              exit 0
            fi
            echo "🔄 Reverting Server C to $ROLLBACK_SHA..."
            git checkout $ROLLBACK_SHA
            if [ -f deploy/docker-compose.server-c.yml ]; then
              docker compose -f deploy/docker-compose.server-c.yml up -d
            fi
            echo "✅ Rollback Server C completed"
          EOF

  # ── 2C. DEPLOY SERVER B (Execution Vault — Windows) ─────────────────
  deploy-server-b:
    name: Deploy Server B (Execution Vault)
    needs: [changes, ci-lint-security, ci-tests, build-images]
    if: |
      always() &&
      (needs.changes.outputs.deploy == 'true' || contains(github.event.head_commit.message, '[force deploy]')) &&
      (needs.ci-lint-security.result == 'success' || needs.ci-lint-security.result == 'skipped') &&
      (needs.ci-tests.result == 'success' || needs.ci-tests.result == 'skipped') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan SSH Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_B_IP }} >> ~/.ssh/known_hosts || true

      - name: Pre-check SSH connectivity
        id: ssh_check_b
        run: |
          echo "🔌 Testing SSH to Server B..."
          if ssh -o ConnectTimeout=10 -o BatchMode=yes Administrator@${{ secrets.SERVER_B_IP }} "echo ok" 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Server B reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server B unreachable — skipping deploy"
          fi

      - name: Deploy Server B (Windows)
        id: deploy_b
        if: steps.ssh_check_b.outputs.reachable == 'true'
        run: |
          echo "🚀 Deploying Server B (Windows)..."
          ssh Administrator@${{ secrets.SERVER_B_IP }} << 'EOF'
            $ErrorActionPreference = "Stop"
            cd C:\opt\trading-bot
            
            $OldSha = (git rev-parse HEAD).Trim()
            $OldSha | Out-File -FilePath .rollback_sha -Encoding utf8
            
            git fetch origin
            git reset --hard origin/main
            git checkout main
            git pull origin main
            
            $NewSha = (git rev-parse HEAD).Trim()
            
            # Backup database
            if (docker ps --format '{{.Names}}' | Select-String -Pattern "^tradingbot-execution$") {
              Write-Output "📦 Backing up trades database from running container..."
              try {
                docker cp tradingbot-execution:/app/data/trades.db C:\Windows\Temp\trades.db.bak
              } catch {
                Write-Output "⚠️ Failed to copy trades database: $_"
              }
            } else {
              # Fallback to local files if native python execution was used
              $LocalDbPaths = @(
                "C:\opt\trading-bot\server\data\trades.db",
                "C:\opt\trading-bot\server\trades.db",
                "C:\opt\trading-bot\trades.db"
              )
              $BackedUp = $false
              foreach ($Path in $LocalDbPaths) {
                if (Test-Path $Path) {
                  Write-Output "📦 Backing up local database file: $Path"
                  Copy-Item -Path $Path -Destination C:\Windows\Temp\trades.db.bak -Force
                  $BackedUp = $true
                  break
                }
              }
              if (-not $BackedUp) {
                Write-Output "⚠️ No database found in container or local folders, skipping backup"
              }
            }
            
            # Nếu code không đổi → skip pull & restart
            if ($OldSha -eq $NewSha) {
              Write-Output "📎 No new commits — skipping pull"
              try {
                $response = Invoke-RestMethod -Uri "http://localhost:5002/health" -Method Get -ErrorAction Stop
                if ($response.status -eq "healthy" -or $response.status -eq "ok") {
                  Write-Output "✅ Server B already healthy (no changes)"
                  if (Test-Path C:\Windows\Temp\trades.db.bak) {
                    Remove-Item C:\Windows\Temp\trades.db.bak -Force
                  }
                  exit 0
                }
              } catch {
                Write-Output "⚠️ No changes but service unavailable — restarting..."
              }
            }
            
            # Login to GHCR, pull, start and logout
            $GhToken = "${{ secrets.GITHUB_TOKEN }}"
            $GhActor = "${{ github.actor }}"
            $GhToken | docker login ghcr.io -u $GhActor --password-stdin
            docker compose -f deploy/docker-compose.server-b.yml pull
            docker compose -f deploy/docker-compose.server-b.yml up -d
            docker logout ghcr.io
            
            # Restore/Import database from backup if it exists
            if (Test-Path C:\Windows\Temp\trades.db.bak) {
              Write-Output "📦 Restoring trades database into container..."
              try {
                docker cp C:\Windows\Temp\trades.db.bak tradingbot-execution:/app/data/trades.db
                docker compose -f deploy/docker-compose.server-b.yml restart
              } catch {
                Write-Output "⚠️ Failed to restore trades database: $_"
              }
            }
            
            echo "🔍 Testing Execution Server Health..."
            for ($i=1; $i -le 10; $i++) {
              try {
                $response = Invoke-RestMethod -Uri "http://localhost:5002/health" -Method Get
                if ($response.status -eq "healthy" -or $response.status -eq "ok") {
                  Write-Output "✅ Server B Healthy!"
                  if (Test-Path C:\Windows\Temp\trades.db.bak) {
                    Remove-Item C:\Windows\Temp\trades.db.bak -Force
                  }
                  exit 0
                }
              } catch {
                # Chờ dịch vụ boot
              }
              Start-Sleep -Seconds 2
            }
            Write-Error "❌ Server B Health Check Failed!"
            exit 1
          EOF
      - name: Post-Deploy Smoke Test (External Routing)
        id: smoke_b
        if: steps.deploy_b.outcome == 'success'
        run: |
          echo "🔌 Testing Tailscale network connectivity to Server B..."
          for i in {1..10}; do
            if curl -sf --connect-timeout 5 http://${{ secrets.SERVER_B_IP }}:5002/health; then
              echo "✅ Tailscale Network Smoke Test Passed!"
              exit 0
            fi
            echo "⏳ Retrying Tailscale connection..."
            sleep 3
          done
          echo "❌ Tailscale Network Smoke Test Failed!"
          exit 1

      - name: Rollback Server B (On Failure)
        if: failure() && steps.ssh_check_b.outputs.reachable == 'true'
        run: |
          echo "⚠️ Checking if rollback is needed..."
          ssh Administrator@${{ secrets.SERVER_B_IP }} << 'EOF'
            cd C:\opt\trading-bot
            if (-not (Test-Path .rollback_sha)) {
              Write-Output "⏭️ No rollback SHA — nothing to revert"
              exit 0
            }
            $CurrentSha = (git rev-parse HEAD).Trim()
            $RollbackSha = (Get-Content .rollback_sha -Raw).Trim()
            if ($CurrentSha -eq $RollbackSha) {
              Write-Output "⏭️ Code unchanged — rollback not needed"
              exit 0
            }
            Write-Output "🔄 Reverting Server B to $RollbackSha..."
            git checkout $RollbackSha
            docker compose -f deploy/docker-compose.server-b.yml up -d
            
            # Restore database backup if it exists
            if (Test-Path C:\Windows\Temp\trades.db.bak) {
              Write-Output "📦 Restoring trades database backup..."
              try {
                docker cp C:\Windows\Temp\trades.db.bak tradingbot-execution:/app/data/trades.db
                docker compose -f deploy/docker-compose.server-b.yml restart
                Remove-Item C:\Windows\Temp\trades.db.bak -Force
              } catch {
                Write-Output "⚠️ Failed to restore trades database: $_"
              }
            }
            Write-Output "✅ Rollback Server B completed"
          EOF

  # ── 3. PIPELINE REPORT & NOTIFICATION ─────────────────────────────────
  deploy-summary:
    name: Pipeline Summary & Telegram Alert
    needs: [build-images, deploy-server-a, deploy-server-c, deploy-server-b]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Summary Alert
        env:
          BUILD_STATUS: ${{ needs.build-images.result }}
          SERVER_A_STATUS: ${{ needs.deploy-server-a.result }}
          SERVER_C_STATUS: ${{ needs.deploy-server-c.result }}
          SERVER_B_STATUS: ${{ needs.deploy-server-b.result }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          cat << 'EOF' > send_telegram.py
          import os
          import urllib.request
          import urllib.parse
          import json

          build_status = os.getenv('BUILD_STATUS', 'unknown')
          server_a_status = os.getenv('SERVER_A_STATUS', 'unknown')
          server_c_status = os.getenv('SERVER_C_STATUS', 'unknown')
          server_b_status = os.getenv('SERVER_B_STATUS', 'unknown')

          def get_emoji(status):
              if status == 'success':
                  return '🟢 SUCCESS'
              elif status == 'failure':
                  return '🔴 FAILED'
              elif status == 'cancelled':
                  return '⚪ CANCELLED'
              elif status == 'skipped':
                  return '🟡 SKIPPED'
              else:
                  return '❓ UNKNOWN'

          emoji_build = get_emoji(build_status)
          emoji_a = get_emoji(server_a_status)
          emoji_c = get_emoji(server_c_status)
          emoji_b = get_emoji(server_b_status)

          overall_success = all(s in ['success', 'skipped'] for s in [build_status, server_a_status, server_c_status, server_b_status])
          pipeline_emoji = '✅' if overall_success else '🚨'
          pipeline_title = '<b>CI/CD Pipeline Deployment Report</b>'

          commit_sha = os.getenv('GITHUB_SHA', '')[:7]
          commit_msg = os.getenv('COMMIT_MESSAGE', 'N/A')
          commit_author = os.getenv('COMMIT_AUTHOR', 'N/A')
          repo = os.getenv('GITHUB_REPOSITORY', '')
          run_id = os.getenv('GITHUB_RUN_ID', '')

          message = f"""
          {pipeline_emoji} {pipeline_title}

          <b>Repository:</b> {repo}
          <b>Run:</b> <a href="https://github.com/{repo}/actions/runs/{run_id}">#{run_id}</a>
          <b>Commit:</b> <code>{commit_sha}</code> by {commit_author}
          <b>Message:</b> {commit_msg}

          <b>Stages Status:</b>
            • Build & Push: {emoji_build}
            • Server A (Gateway): {emoji_a}
            • Server C (AI Core): {emoji_c}
            • Server B (Execution): {emoji_b}
          """

          bot_token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')

          if not bot_token or not chat_id:
              print("Telegram credentials missing, cannot send alert.")
              exit(1)

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message.strip(),
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true'
          }).encode('utf-8')

          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          try:
              with urllib.request.urlopen(req) as response:
                  print("Telegram alert sent successfully.")
          except Exception as e:
              print(f"Failed to send Telegram alert: {e}")
          EOF
          python send_telegram.py

      - name: Generate GHA Summary Dashboard
        env:
          BUILD_STATUS: ${{ needs.build-images.result }}
          SERVER_A_STATUS: ${{ needs.deploy-server-a.result }}
          SERVER_C_STATUS: ${{ needs.deploy-server-c.result }}
          SERVER_B_STATUS: ${{ needs.deploy-server-b.result }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          cat << 'EOF' > generate_summary.py
          import os

          build_status = os.getenv('BUILD_STATUS', 'unknown')
          server_a_status = os.getenv('SERVER_A_STATUS', 'unknown')
          server_c_status = os.getenv('SERVER_C_STATUS', 'unknown')
          server_b_status = os.getenv('SERVER_B_STATUS', 'unknown')

          def get_badge(status):
              if status == 'success':
                  return '🟢 Success'
              elif status == 'failure':
                  return '🔴 Failed'
              elif status == 'cancelled':
                  return '⚪ Cancelled'
              elif status == 'skipped':
                  return '🟡 Skipped'
              else:
                  return '❓ Unknown'

          badge_build = get_badge(build_status)
          badge_a = get_badge(server_a_status)
          badge_c = get_badge(server_c_status)
          badge_b = get_badge(server_b_status)

          overall_success = all(s in ['success', 'skipped'] for s in [build_status, server_a_status, server_c_status, server_b_status])
          summary_emoji = '✅' if overall_success else '🚨'
          summary_title = 'Production Deployment Summary'

          commit_sha = os.getenv('GITHUB_SHA', '')[:7]
          commit_msg = os.getenv('COMMIT_MESSAGE', 'N/A')
          commit_author = os.getenv('COMMIT_AUTHOR', 'N/A')
          repo = os.getenv('GITHUB_REPOSITORY', '')
          run_id = os.getenv('GITHUB_RUN_ID', '')

          summary_content = f"""# {summary_emoji} {summary_title}

          ## Pipeline Info
          - **Repository**: {repo}
          - **Workflow Run**: [#{run_id}](https://github.com/{repo}/actions/runs/{run_id})
          - **Commit**: `{commit_sha}` (Author: {commit_author})
          - **Commit Message**: *{commit_msg}*

          ## Deployment Stages Status
          | Stage | Status | Description |
          | :--- | :--- | :--- |
          | **Build & Push Images** | {badge_build} | GHA build layer and scan with Trivy |
          | **Server A (Gateway)** | {badge_a} | VBS Gateway deploy & DB safe-gate |
          | **Server C (AI Core)** | {badge_c} | ChromaDB and Analyzer pull & check |
          | **Server B (Execution)** | {badge_b} | Windows host pull & fallback restore |

          ## Security Hardening Details
          - **Vulnerability Scanner**: Trivy Enforcement (`severity: CRITICAL`)
          - **Network Validation**: External Tailscale Network Smoke Tests
          - **Safe-Gate Backup**: Auto-Backup and import SQLite databases for Server A & Server B
          """

          summary_file = os.getenv('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'w', encoding='utf-8') as f:
                  f.write(summary_content)
              print("GHA Step Summary generated successfully.")
          else:
              print("GITHUB_STEP_SUMMARY environment variable not found.")
          EOF
          python generate_summary.py
