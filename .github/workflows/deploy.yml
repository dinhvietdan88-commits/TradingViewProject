# ╔══════════════════════════════════════════════════════════════════╗
# ║  CI/CD PRODUCTION PIPELINE                                      ║
# ║                                                                ║
# ║  Triggers:                                                     ║
# ║    workflow_run  ← ci.yml completed on main (primary)          ║
# ║    push → main  ← [force deploy] bypass only                  ║
# ║                                                                ║
# ║  CI gate is enforced by ci.yml (_ci-gate.yml reusable).        ║
# ║  deploy.yml does NOT re-run lint or tests — it verifies        ║
# ║  the sentinel written by _ci-gate.yml jobs.                    ║
# ╚══════════════════════════════════════════════════════════════════╝
name: CI/CD Production Pipeline

on:
  # Primary: fires AFTER ci.yml completes successfully on main
  workflow_run:
    workflows: ["CI Pull Request Pipeline"]
    types: [completed]
    branches: [main]
  # Fallback: direct push with [force deploy] or merge commit
  push:
    branches:
      - main

concurrency:
  group: deploy-production
  cancel-in-progress: true

# All actions upgraded to Node.js 24 native versions (setup-python@v6, checkout@v6, cache@v5)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  # ── 0. CHANGE DETECTION ────────────────────────────────────────────
  # V2: 3-Tier Deploy Strategy — per-server tier outputs.
  # Tier 0 = skip (no deploy), Tier 1 = light pull + restart, Tier 2 = full image deploy.
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    # Early-exit gate: skip entire pipeline when push fires WITHOUT [force deploy].
    # workflow_run always proceeds; push only proceeds with [force deploy].
    if: "github.event_name == 'workflow_run' || (github.event_name == 'push' && contains(github.event.head_commit.message, '[force deploy]'))"
    outputs:
      code: ${{ steps.filter.outputs.code }}
      deploy: ${{ steps.filter.outputs.deploy }}
      docker: ${{ steps.filter.outputs.docker }}
      server_a_tier: ${{ steps.tiers.outputs.server_a_tier }}
      server_b_tier: ${{ steps.tiers.outputs.server_b_tier }}
      server_c_tier: ${{ steps.tiers.outputs.server_c_tier }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Resolve base SHA for paths-filter
        id: base_sha
        run: |
          # For workflow_run: github.event.before is absent, resolve HEAD~1 to an actual SHA
          # For push: use github.event.before if valid, else default branch
          if [ "${{ github.event_name }}" = "workflow_run" ]; then
            SHA=$(git rev-parse HEAD~1 2>/dev/null || echo "")
            echo "sha=${SHA}" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.before }}" ] && [ "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]; then
            echo "sha=${{ github.event.before }}" >> $GITHUB_OUTPUT
          else
            echo "sha=${{ github.event.repository.default_branch }}" >> $GITHUB_OUTPUT
          fi

      - name: Check for changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          base: ${{ steps.base_sha.outputs.sha }}
          filters: |
            code:
              - 'nerves/workers/trading/**'
              - 'vbs/**'
              - 'Dockerfile'
              - 'pine/**'
              - '.github/workflows/**'
            deploy:
              - 'nerves/workers/trading/**'
              - 'Dockerfile'
              - 'deploy/**'
              - 'vbs/**'
              - '.github/workflows/**'
            docker:
              - 'nerves/workers/trading/**'
              - 'Dockerfile'
              - 'vbs/**'
              - 'docs/knowledge/**'

      - name: Compute deploy tiers per server
        id: tiers
        run: |
          # ── Safety Net 1: [force deploy] in commit message ──
          MSG=$(git log -1 --format=%s)
          PARENTS=$(git rev-list --parents -1 HEAD | wc -w)

          if [[ "$MSG" == *"[force deploy]"* ]] || [ "$PARENTS" -gt 2 ]; then
            echo "🔴 Safety net triggered: force deploy or merge commit"
            echo "server_a_tier=2" >> $GITHUB_OUTPUT
            echo "server_b_tier=2" >> $GITHUB_OUTPUT
            echo "server_c_tier=2" >> $GITHUB_OUTPUT
            exit 0
          fi

          # ── Per-file tier mapping ──
          CHANGED=$(git diff --name-only HEAD~1 2>/dev/null || echo "")
          if [ -z "$CHANGED" ]; then
            echo "⚠️ No parent commit — defaulting to Tier 2 ALL"
            echo "server_a_tier=2" >> $GITHUB_OUTPUT
            echo "server_b_tier=2" >> $GITHUB_OUTPUT
            echo "server_c_tier=2" >> $GITHUB_OUTPUT
            exit 0
          fi

          A=0; B=0; C=0

          while IFS= read -r f; do
            case "$f" in
              vbs/*)                              [[ $A -lt 2 ]] && A=2 ;;
              # Fix #68: Split Server C tier — only infra changes need image rebuild
              # .py-only changes: Tier 1 (bind mount serves latest code after git pull + restart)
              # requirements / Dockerfile changes: Tier 2 (pip packages or system deps changed)
              nerves/workers/trading/requirements*.txt)    [[ $C -lt 2 ]] && C=2 ;;
              nerves/workers/trading/Dockerfile*)          [[ $C -lt 2 ]] && C=2 ;;
              nerves/workers/trading/*)                    [[ $C -lt 1 ]] && C=1 ;;
              server/*)                            [[ $B -lt 2 ]] && B=2 ;;
              Dockerfile)                          [[ $B -lt 2 ]] && B=2; [[ $C -lt 2 ]] && C=2 ;;
              deploy/*server-a* | deploy/*vbs*)    [[ $A -lt 1 ]] && A=1 ;;
              deploy/*server-b*)                   [[ $B -lt 1 ]] && B=1 ;;
              deploy/*server-c* | deploy/agy*)     [[ $C -lt 1 ]] && C=1 ;;
              deploy/* | .env* | config.py)        # Shared config → pull all
                [[ $A -lt 1 ]] && A=1
                [[ $B -lt 1 ]] && B=1
                [[ $C -lt 1 ]] && C=1 ;;
              docs/* | .github/* | *.md | pine/* | scratch/* | provisioning*) ;; # No deploy
              *)  # Safety Net 3: Unknown file → pull all
                echo "⚠️ Unknown file pattern: $f → Tier 1 safety"
                [[ $A -lt 1 ]] && A=1
                [[ $B -lt 1 ]] && B=1
                [[ $C -lt 1 ]] && C=1 ;;
            esac
          done <<< "$CHANGED"

          echo "server_a_tier=$A" >> $GITHUB_OUTPUT
          echo "server_b_tier=$B" >> $GITHUB_OUTPUT
          echo "server_c_tier=$C" >> $GITHUB_OUTPUT
          echo "📊 Deploy Tiers: A=$A B=$B C=$C"


  # ── 1. CI GATE VERIFICATION ─────────────────────────────────────────
  # ci.yml runs _ci-gate.yml (reusable) which writes sentinel caches.
  # This job verifies the gate without re-running any tests.
  check-ci-gate:
    name: "Verify CI Gate"
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 2

      - name: Compute code hash
        id: hash
        run: |
          CODE_HASH=$(find nerves/workers/trading -type f -name '*.py' \
            | sort | xargs sha256sum | sha256sum | cut -d' ' -f1)
          echo "code=$CODE_HASH" >> $GITHUB_OUTPUT

      - name: Restore fast-test sentinel
        id: sentinel
        uses: actions/cache/restore@v5
        with:
          path: .test-passed-fast
          key: test-passed-fast-${{ steps.hash.outputs.code }}

      - name: Validate CI gate
        run: |
          EVENT="${{ github.event_name }}"
          MSG=$(git log -1 --format=%s 2>/dev/null || echo "")
          PARENTS=$(git rev-list --parents -1 HEAD | wc -w)

          echo "════════════════════════════════════"
          echo "  CI GATE VALIDATION"
          echo "  Event:    $EVENT"
          echo "  Sentinel: ${{ steps.sentinel.outputs.cache-hit }}"
          echo "  Hash:     ${{ steps.hash.outputs.code }}"
          echo "════════════════════════════════════"

          # (a) workflow_run trigger: ci.yml already completed
          if [ "$EVENT" = "workflow_run" ]; then
            CONCLUSION="${{ github.event.workflow_run.conclusion }}"
            echo "workflow_run conclusion: $CONCLUSION"
            if [ "$CONCLUSION" = "success" ]; then
              echo "✅ CI gate: workflow_run success — deploy allowed"
              exit 0
            else
              echo "❌ CI gate: ci.yml concluded '$CONCLUSION' — deploy blocked"
              exit 1
            fi
          fi

          # (b) [force deploy] or merge commit bypass (direct push trigger)
          if [[ "$MSG" == *"[force deploy]"* ]] || [ "$PARENTS" -gt 2 ]; then
            echo "🔴 [force deploy] / merge commit — bypassing sentinel check"
            exit 0
          fi

          # (c) Sentinel cache from _ci-gate.yml fast tests
          if [ "${{ steps.sentinel.outputs.cache-hit }}" = "true" ]; then
            echo "✅ CI sentinel found — tests passed for hash ${{ steps.hash.outputs.code }}"
            exit 0
          fi

          echo "❌ CI gate not satisfied."
          echo "   Options: (1) let ci.yml complete, (2) add [force deploy] to commit."
          exit 1


  # ── 2. BUILD & PUSH DOCKER IMAGES (Parallel Matrix + Hash Skip) ──
  # Optimization: 3 images build simultaneously on separate runners.
  # Hash-based skip: if source files haven't changed, build is skipped.
  # Scoped GHA cache: each image has its own BuildKit cache partition.
  # Trivy runs inside each matrix entry (parallel, not sequential).
  build-images:
    name: "Build: ${{ matrix.name }}"
    needs: [changes, check-ci-gate]
    if: |
      always() &&
      (needs.changes.outputs.docker == 'true' || contains(github.event.head_commit.message, '[force deploy]')) &&
      (needs.check-ci-gate.result == 'success')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: VBS
            image: tradingbot-vbs
            context: ./vbs
            file: ./vbs/Dockerfile
            target: ""
            hash_paths: "vbs/"
          - name: Execution
            image: tradingbot-execution
            context: .
            file: ./Dockerfile
            target: runtime-execution
            hash_paths: "nerves/workers/trading/ Dockerfile"
          - name: Analyzer
            image: tradingbot-analyzer
            context: .
            file: ./Dockerfile
            target: runtime-analyzer
            hash_paths: "nerves/workers/trading/ Dockerfile docs/knowledge/"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Compute image content hash
        id: hash
        run: |
          HASH=$(find ${{ matrix.hash_paths }} -type f \( -name '*.py' -o -name '*.txt' -o -name '*.md' -o -name 'Dockerfile*' -o -name '*.yml' -o -name '*.yaml' \) 2>/dev/null | sort | xargs sha256sum 2>/dev/null | sha256sum | cut -d' ' -f1)
          SHORT=${HASH:0:12}
          echo "hash=$SHORT" >> $GITHUB_OUTPUT
          echo "📦 [${{ matrix.name }}] Content hash: $SHORT"

      - name: Check build cache
        id: build-cache
        uses: actions/cache@v5
        with:
          path: .build-passed-${{ matrix.name }}
          key: build-${{ matrix.name }}-${{ steps.hash.outputs.hash }}

      - name: Skip build (cache hit)
        if: steps.build-cache.outputs.cache-hit == 'true'
        run: echo "⚡ [${{ matrix.name }}] Already built for hash ${{ steps.hash.outputs.hash }} — skipping."

      - name: Set up Docker Buildx
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Build and Push ${{ matrix.name }}"
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          target: ${{ matrix.target || '' }}
          push: true
          tags: |
            ghcr.io/dinhvietdan88-commits/${{ matrix.image }}:latest
            ghcr.io/dinhvietdan88-commits/${{ matrix.image }}:${{ steps.hash.outputs.hash }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=min,scope=${{ matrix.name }}

      - name: "Trivy Scan: ${{ matrix.name }}"
        if: steps.build-cache.outputs.cache-hit != 'true'
        uses: aquasecurity/trivy-action@v0.36.0
        env:
          TRIVY_USERNAME: ${{ github.actor }}
          TRIVY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        with:
          image-ref: 'ghcr.io/dinhvietdan88-commits/${{ matrix.image }}:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL'

      - name: Mark build passed
        if: steps.build-cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p .build-passed-${{ matrix.name }}
          echo "${{ steps.hash.outputs.hash }}" > .build-passed-${{ matrix.name }}/hash.txt
          echo "$(date -u +%Y-%m-%dT%H:%M:%SZ)" > .build-passed-${{ matrix.name }}/timestamp.txt

  # ── 2A. DEPLOY SERVER A (Gateway) ──────────────────────────────────
  deploy-server-a:
    name: "Deploy Server A (Gateway) [T${{ needs.changes.outputs.server_a_tier }}]"
    needs: [changes, check-ci-gate, build-images]
    if: |
      always() &&
      needs.changes.outputs.server_a_tier != '0' &&
      (needs.check-ci-gate.result == 'success') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan SSH Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_A_IP }} >> ~/.ssh/known_hosts || true

      - name: Pre-check SSH connectivity
        id: ssh_check_a
        run: |
          echo "🔌 Testing SSH to Server A..."
          if ssh -o ConnectTimeout=10 -o BatchMode=yes botuser@${{ secrets.SERVER_A_IP }} "echo ok" 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Server A reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server A unreachable — skipping deploy"
          fi

      - name: Deploy Server A
        id: deploy_a
        if: steps.ssh_check_a.outputs.reachable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_TIER: ${{ needs.changes.outputs.server_a_tier }}
        run: |
          echo "🚀 Deploying Server A (Tier $DEPLOY_TIER)..."
          ssh botuser@${{ secrets.SERVER_A_IP }} "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' DEPLOY_TIER='$DEPLOY_TIER' bash -s" << 'EOF'
            set -e
            cd /opt/trading-bot
            git reset --hard origin/main
            OLD_SHA=$(git rev-parse HEAD)
            echo "$OLD_SHA" > .rollback_sha
            git fetch origin
            git checkout main
            PULL_OUTPUT=$(git pull origin main 2>&1)
            echo "$PULL_OUTPUT"
            NEW_SHA=$(git rev-parse HEAD)

            # Backup database if container is running
            if docker ps --format '{{.Names}}' | grep -q "^tradingbot-vbs$"; then
              echo "📦 Backing up SQLite database..."
              docker cp tradingbot-vbs:/app/data/signal_queue.db /tmp/signal_queue.db.bak || true
            else
              # Fallback to local files
              for path in "/opt/trading-bot/vbs/data/signal_queue.db" "/opt/trading-bot/vbs/signal_queue.db" "/opt/trading-bot/signal_queue.db"; do
                if [ -f "$path" ]; then
                  echo "📦 Backing up local database file: $path"
                  cp "$path" /tmp/signal_queue.db.bak
                  break
                fi
              done
            fi

            # Nếu code không đổi → skip pull & restart, health check only
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "📎 No new commits — skipping pull"
              if curl -sf http://localhost:5000/health > /dev/null 2>&1; then
                echo "✅ Server A already healthy (no changes)"
                rm -f /tmp/signal_queue.db.bak
                exit 0
              fi
              echo "⚠️ No changes but service unhealthy — restarting..."
            fi

            # ── Tier-based deploy logic ──
            if [ "$DEPLOY_TIER" = "2" ]; then
              # Tier 2: Full deploy — docker pull + up
              echo "🔧 Tier 2: Full image deploy"
              echo "DEPLOYED" > /tmp/.deploy_state
              echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
              docker compose -f deploy/docker-compose.server-a.yml pull
              docker compose -f deploy/docker-compose.server-a.yml up -d
              docker logout ghcr.io
            else
              # Tier 1: Light deploy — restart only (config/code pulled via git)
              echo "🔄 Tier 1: Light restart (config refresh)"
              docker compose -f deploy/docker-compose.server-a.yml restart
            fi

            # Restore/Import database from backup if it exists
            if [ -f /tmp/signal_queue.db.bak ]; then
              echo "📦 Restoring database into container..."
              docker cp /tmp/signal_queue.db.bak tradingbot-vbs:/app/data/signal_queue.db || true
              docker compose -f deploy/docker-compose.server-a.yml restart
            fi

            echo "🔍 Testing Gateway Health..."
            for i in {1..10}; do
              if curl -sf http://localhost:5000/health > /dev/null; then
                echo "✅ Server A Healthy!"
                rm -f /tmp/signal_queue.db.bak
                exit 0
              fi
              sleep 2
            done
            echo "❌ Server A Health Check Failed!"
            exit 1
          EOF
      - name: Post-Deploy Smoke Test (External Routing)
        id: smoke_a
        if: steps.deploy_a.outcome == 'success'
        run: |
          echo "🔌 Testing Tailscale network connectivity to Server A..."
          for i in {1..10}; do
            if curl -sf --connect-timeout 5 http://${{ secrets.SERVER_A_IP }}:5000/health; then
              echo "✅ Tailscale Network Smoke Test Passed!"
              exit 0
            fi
            echo "⏳ Retrying Tailscale connection..."
            sleep 3
          done
          echo "❌ Tailscale Network Smoke Test Failed!"
          exit 1

      - name: Rollback Server A (On Failure)
        if: failure() && steps.ssh_check_a.outputs.reachable == 'true'
        run: |
          echo "⚠️ Checking if rollback is needed..."
          ssh botuser@${{ secrets.SERVER_A_IP }} 'bash -s' << 'EOF'
            cd /opt/trading-bot
            if [ ! -f .rollback_sha ]; then
              echo "⏭️ No rollback SHA — nothing to revert"
              exit 0
            fi
            CURRENT_SHA=$(git rev-parse HEAD)
            ROLLBACK_SHA=$(cat .rollback_sha)
            if [ "$CURRENT_SHA" = "$ROLLBACK_SHA" ]; then
              echo "⏭️ Code unchanged — rollback not needed"
              exit 0
            fi
            echo "🔄 Reverting Server A to $ROLLBACK_SHA..."
            git checkout $ROLLBACK_SHA
            docker compose -f deploy/docker-compose.server-a.yml up -d

            # Restore database backup if it exists
            if [ -f /tmp/signal_queue.db.bak ]; then
              echo "📦 Restoring database backup..."
              docker cp /tmp/signal_queue.db.bak tradingbot-vbs:/app/data/signal_queue.db || true
              docker compose -f deploy/docker-compose.server-a.yml restart
              rm -f /tmp/signal_queue.db.bak
            fi
            echo "✅ Rollback Server A completed"
          EOF

  # ── 2B. DEPLOY SERVER C (AI Core) ──────────────────────────────────
  deploy-server-c:
    name: "Deploy Server C (AI Core) [T${{ needs.changes.outputs.server_c_tier }}]"
    needs: [changes, check-ci-gate, build-images]
    if: |
      always() &&
      needs.changes.outputs.server_c_tier != '0' &&
      (needs.check-ci-gate.result == 'success') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan SSH Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -p ${{ secrets.SSH_PORT_C || '22' }} -H ${{ secrets.SERVER_C_IP }} >> ~/.ssh/known_hosts || true

      - name: Pre-check SSH connectivity
        id: ssh_check_c
        run: |
          echo "🔌 Testing SSH to Server C..."
          if ssh -p ${{ secrets.SSH_PORT_C || '22' }} -o ConnectTimeout=10 -o BatchMode=yes botuser@${{ secrets.SERVER_C_IP }} "echo ok" 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Server C reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server C unreachable — skipping deploy"
          fi

      - name: Deploy Server C
        id: deploy_c
        if: steps.ssh_check_c.outputs.reachable == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_ACTOR: ${{ github.actor }}
          DEPLOY_TIER: ${{ needs.changes.outputs.server_c_tier }}
          AGY_BRIDGE_SECRET: ${{ secrets.AGY_BRIDGE_SECRET }}
        run: |
          echo "🚀 Deploying Server C (Tier $DEPLOY_TIER)..."
          ssh -p ${{ secrets.SSH_PORT_C || '22' }} botuser@${{ secrets.SERVER_C_IP }} "GH_TOKEN='$GH_TOKEN' GH_ACTOR='$GH_ACTOR' DEPLOY_TIER='$DEPLOY_TIER' AGY_BRIDGE_SECRET='$AGY_BRIDGE_SECRET' bash -s" << 'EOF'
            set -e
            DEPLOY_DIR="/opt/trading-bot"
            [ ! -d "$DEPLOY_DIR/.git" ] && DEPLOY_DIR="/home/botuser/trading-bot"
            cd "$DEPLOY_DIR"
            git reset --hard origin/main
            OLD_SHA=$(git rev-parse HEAD)
            echo "$OLD_SHA" > .rollback_sha
            git fetch origin
            git checkout main
            PULL_OUTPUT=$(git pull origin main 2>&1)
            echo "$PULL_OUTPUT"
            NEW_SHA=$(git rev-parse HEAD)

            # Nếu code không đổi → skip pull & restart, health check only
            if [ "$OLD_SHA" = "$NEW_SHA" ]; then
              echo "📎 No new commits — skipping pull"
              if curl -sf http://localhost:8000/api/v2/heartbeat > /dev/null 2>&1; then
                echo "✅ Server C already healthy (no changes)"
                exit 0
              fi
              echo "⚠️ No changes but service unhealthy — restarting..."
            fi

            # ── Tier-based deploy logic ──
            if [ -f deploy/docker-compose.server-c.yml ]; then
              if [ "$DEPLOY_TIER" = "2" ]; then
                echo "🔧 Tier 2: Full image deploy"

                echo "✅ Docker filesystem writable"
                echo "$GH_TOKEN" | docker login ghcr.io -u "$GH_ACTOR" --password-stdin
                docker compose -f deploy/docker-compose.server-c.yml pull
                docker compose -f deploy/docker-compose.server-c.yml up -d
                docker logout ghcr.io
              else
                echo "🔄 Tier 1: Light restart (config refresh)"
                docker compose -f deploy/docker-compose.server-c.yml restart
              fi
            fi

            # ── agy-bridge sidecar (host-level Gemini proxy) ──────────
            echo "🔧 Setting up agy-bridge sidecar..."

            # Ensure Python 3.11 is available for google-antigravity
            if command -v python3.11 &>/dev/null; then
              PY=python3.11
            elif command -v python3 &>/dev/null; then
              PY=python3
            else
              echo "⚠️ No Python3 found — skipping agy-bridge"
              PY=""
            fi

            if [ -n "$PY" ] && [ -f deploy/agy-bridge.py ]; then
              # Install dependencies (idempotent)
              $PY -m pip install --user --quiet fastapi uvicorn google-genai 2>&1 | tail -2

              # Try google-antigravity (needs Python 3.10+)
              $PY -m pip install --user --quiet google-antigravity 2>&1 | tail -1 || true

              # Create .env.agy if missing
              if [ ! -f deploy/.env.agy ]; then
                GEMINI_KEY=$(grep "^GEMINI_API_KEY=" deploy/.env 2>/dev/null | cut -d= -f2- || echo "")
                printf "ANTIGRAVITY_API_KEY=%s\nGEMINI_API_KEY=%s\n" "${GEMINI_KEY:-REPLACE_ME}" "${GEMINI_KEY:-REPLACE_ME}" > deploy/.env.agy
                chmod 600 deploy/.env.agy
              fi

              # Inject AGY_BRIDGE_SECRET from GitHub Secrets (idempotent)
              if [ -n "$AGY_BRIDGE_SECRET" ]; then
                sed -i '/^AGY_BRIDGE_SECRET=/d' deploy/.env.agy deploy/.env 2>/dev/null || true
                echo "AGY_BRIDGE_SECRET=$AGY_BRIDGE_SECRET" >> deploy/.env.agy
                echo "AGY_BRIDGE_SECRET=$AGY_BRIDGE_SECRET" >> deploy/.env
                echo "✅ AGY_BRIDGE_SECRET injected into .env.agy + .env"
              fi

              # Deploy agy CLI security settings (deny list for --sandbox mode)
              if [ -f deploy/agy-settings.json ]; then
                AGY_SETTINGS_DIR="$HOME/.gemini/antigravity-cli"
                mkdir -p "$AGY_SETTINGS_DIR"
                cp deploy/agy-settings.json "$AGY_SETTINGS_DIR/settings.json"
                echo "✅ agy settings.json deployed (sandbox deny list)"
              fi

              # Update systemd service (ExecStart uses detected Python)
              PY_PATH=$(command -v $PY)
              sed "s|ExecStart=.*python.*agy-bridge.py|ExecStart=${PY_PATH} $(pwd)/deploy/agy-bridge.py|" \
                deploy/agy-bridge.service > /tmp/agy-bridge.service.tmp

              # Install service if changed (needs passwordless sudo for botuser)
              if ! diff -q /tmp/agy-bridge.service.tmp /etc/systemd/system/agy-bridge.service &>/dev/null 2>&1; then
                if sudo -n cp /tmp/agy-bridge.service.tmp /etc/systemd/system/agy-bridge.service 2>/dev/null; then
                  sudo -n systemctl daemon-reload
                  sudo -n systemctl enable agy-bridge
                  sudo -n systemctl restart agy-bridge
                  echo "✅ agy-bridge service updated and restarted"
                else
                  echo "⚠️ agy-bridge service update needs sudo — skipping (manual)"
                fi
              else
                # Service file unchanged — but Python code may have changed
                # Always restart to pick up new code after git pull
                sudo -n systemctl restart agy-bridge 2>/dev/null || echo "⚠️ agy-bridge restart needs sudo"
                echo "✅ agy-bridge restarted (code refresh)"
              fi

              # Verify bridge health
              sleep 2
              if curl -sf http://localhost:9100/health > /dev/null 2>&1; then
                echo "✅ agy-bridge health OK"
              else
                echo "⚠️ agy-bridge health check failed (non-blocking)"
              fi
              rm -f /tmp/agy-bridge.service.tmp
            fi

            # Fix #68: No hot-patch needed — source is bind-mounted from host git directory.
            # git pull above already updated /opt/trading-bot/nerves/workers/trading/
            # TRADING_SRC bind mount in docker-compose.server-c.yml serves latest code.
            # Container restart (Tier 1) is sufficient for Python-only changes.
            echo "Source code served via bind mount — no docker cp needed"

            echo "🔍 Testing Server C Health..."
            for i in {1..30}; do
              CHROMA_OK=false
              ANALYZER_OK=false

              if curl -sf http://localhost:8001/api/v2/heartbeat > /dev/null 2>&1; then
                CHROMA_OK=true
              fi

              STATUS=$(docker inspect --format='{{.State.Health.Status}}' tradingbot-analyzer 2>/dev/null || echo "not_found")
              if [ "$STATUS" = "healthy" ]; then
                ANALYZER_OK=true
              fi

              if [ "$CHROMA_OK" = true ] && [ "$ANALYZER_OK" = true ]; then
                echo "✅ Server C is fully healthy! (ChromaDB + Analyzer OK)"
                exit 0
              fi

              echo "⏳ Waiting for services (ChromaDB: $CHROMA_OK, Analyzer: $STATUS)..."
              sleep 3
            done

            echo "❌ Server C Health Check Failed! (ChromaDB: $CHROMA_OK, Analyzer: $STATUS)"
            exit 1

            # ── Tier 2 only: RAG vector count verification via agy-bridge ──────
            # Calls /admin/verify (host-side, no sandbox) which delegates to
            # analyzer /admin/rag-verify → checks ChromaDB vector count.
            # This is the runtime proof for issue #56 fix.
            if [ "$DEPLOY_TIER" = "2" ]; then
              echo "🧠 Verifying RAG/ChromaDB vector count (issue #56)..."

              BRIDGE_SECRET=$(grep "^AGY_BRIDGE_SECRET=" deploy/.env.agy 2>/dev/null | cut -d= -f2- || echo "")

              # Primary: delegate via agy-bridge /admin/verify
              if [ -n "$BRIDGE_SECRET" ]; then
                RAG_RESULT=$(curl -s -X POST "http://localhost:9100/admin/verify" \
                  -H "Authorization: Bearer $BRIDGE_SECRET" \
                  -H "Content-Type: application/json" \
                  --max-time 35 || echo '{"status":"error","error":"curl failed"}')
              else
                # Fallback: opt_admin=true → direct docker exec (no auth needed internally)
                RAG_RESULT=$(curl -s -X POST "http://localhost:9100/admin/verify?opt_admin=true" \
                  -H "Content-Type: application/json" \
                  --max-time 35 || echo '{"status":"error","error":"bridge unreachable"}')
              fi

              RAG_STATUS=$(echo "$RAG_RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('status','unknown'))" 2>/dev/null || echo "parse_error")
              RAG_COUNT=$(echo "$RAG_RESULT" | python3 -c "import sys,json; d=json.load(sys.stdin); print(d.get('vector_count',-1))" 2>/dev/null || echo "-1")

              if [ "$RAG_STATUS" = "ok" ] || [ "$RAG_STATUS" = "re-ingested" ]; then
                echo "✅ RAG verified: ${RAG_COUNT} vectors in ChromaDB (status=${RAG_STATUS})"
              else
                echo "⚠️ RAG verification: status=${RAG_STATUS}, vectors=${RAG_COUNT}"
                echo "   Full result: $RAG_RESULT"
                # Non-blocking — RAG failure doesn't kill deploy (ChromaDB may still be warming up)
                echo "   → Continuing deploy. Check /admin/verify manually after warmup."
              fi
            fi
          EOF

      - name: Rollback Server C (On Failure)
        if: failure() && steps.deploy_c.outcome == 'failure' && steps.ssh_check_c.outputs.reachable == 'true'
        run: |
          echo "⚠️ Checking if rollback is needed..."
          ssh -p ${{ secrets.SSH_PORT_C || '22' }} botuser@${{ secrets.SERVER_C_IP }} 'bash -s' << 'EOF'
            DEPLOY_DIR="/opt/trading-bot"
            [ ! -d "$DEPLOY_DIR/.git" ] && DEPLOY_DIR="/home/botuser/trading-bot"
            cd "$DEPLOY_DIR"
            if [ ! -f .rollback_sha ]; then
              echo "⏭️ No rollback SHA — nothing to revert"
              exit 0
            fi
            CURRENT_SHA=$(git rev-parse HEAD)
            ROLLBACK_SHA=$(cat .rollback_sha)
            if [ "$CURRENT_SHA" = "$ROLLBACK_SHA" ]; then
              echo "⏭️ Code unchanged — rollback not needed"
              exit 0
            fi
            echo "🔄 Reverting Server C to $ROLLBACK_SHA..."
            git checkout $ROLLBACK_SHA
            if [ -f deploy/docker-compose.server-c.yml ]; then
              docker compose -f deploy/docker-compose.server-c.yml up -d
            fi
            echo "✅ Rollback Server C completed"
          EOF

  # ── 2C. DEPLOY SERVER B (Execution Vault — Windows) ─────────────────
  deploy-server-b:
    name: "Deploy Server B (Execution Vault) [T${{ needs.changes.outputs.server_b_tier }}]"
    needs: [changes, check-ci-gate, build-images]
    if: |
      always() &&
      needs.changes.outputs.server_b_tier != '0' &&
      (needs.check-ci-gate.result == 'success') &&
      (needs.build-images.result == 'success' || needs.build-images.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Connect to Tailscale VPN
        uses: tailscale/github-action@v4
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}


      - name: Setup SSH Agent
        uses: webfactory/ssh-agent@v0.10.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Scan SSH Host Keys
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ secrets.SERVER_B_IP }} >> ~/.ssh/known_hosts || true

      - name: Pre-check SSH connectivity
        id: ssh_check_b
        run: |
          echo "🔌 Testing SSH to Server B..."
          if ssh -o ConnectTimeout=10 -o BatchMode=yes Administrator@${{ secrets.SERVER_B_IP }} "echo ok" 2>/dev/null; then
            echo "reachable=true" >> $GITHUB_OUTPUT
            echo "✅ Server B reachable"
          else
            echo "reachable=false" >> $GITHUB_OUTPUT
            echo "⚠️ Server B unreachable — skipping deploy"
          fi

      - name: Deploy Server B (Windows)
        id: deploy_b
        if: steps.ssh_check_b.outputs.reachable == 'true'
        env:
          DEPLOY_TIER: ${{ needs.changes.outputs.server_b_tier }}
        run: |
          echo "🚀 Deploying Server B (Tier $DEPLOY_TIER)..."
          ssh Administrator@${{ secrets.SERVER_B_IP }} << 'EOF'
            $ErrorActionPreference = "Stop"
            cd C:\opt\trading-bot

            $OldSha = (git rev-parse HEAD).Trim()
            $OldSha | Out-File -FilePath .rollback_sha -Encoding utf8

            git fetch origin
            git reset --hard origin/main
            git checkout main
            git pull origin main

            $NewSha = (git rev-parse HEAD).Trim()

            # Backup database
            if (docker ps --format '{{.Names}}' | Select-String -Pattern "^tradingbot-execution$") {
              Write-Output "📦 Backing up trades database from running container..."
              try {
                docker cp tradingbot-execution:/app/data/trades.db C:\Windows\Temp\trades.db.bak
              } catch {
                Write-Output "⚠️ Failed to copy trades database: $_"
              }
            } else {
              # Fallback to local files if native python execution was used
              $LocalDbPaths = @(
                "C:\opt\trading-bot\server\data\trades.db",
                "C:\opt\trading-bot\server\trades.db",
                "C:\opt\trading-bot\trades.db"
              )
              $BackedUp = $false
              foreach ($Path in $LocalDbPaths) {
                if (Test-Path $Path) {
                  Write-Output "📦 Backing up local database file: $Path"
                  Copy-Item -Path $Path -Destination C:\Windows\Temp\trades.db.bak -Force
                  $BackedUp = $true
                  break
                }
              }
              if (-not $BackedUp) {
                Write-Output "⚠️ No database found in container or local folders, skipping backup"
              }
            }

            # Nếu code không đổi → skip pull & restart
            if ($OldSha -eq $NewSha) {
              Write-Output "📎 No new commits — skipping pull"
              try {
                $response = Invoke-RestMethod -Uri "http://localhost:5002/health" -Method Get -ErrorAction Stop
                if ($response.status -eq "healthy" -or $response.status -eq "ok") {
                  Write-Output "✅ Server B already healthy (no changes)"
                  if (Test-Path C:\Windows\Temp\trades.db.bak) {
                    Remove-Item C:\Windows\Temp\trades.db.bak -Force
                  }
                  exit 0
                }
              } catch {
                Write-Output "⚠️ No changes but service unavailable — restarting..."
              }
            }

            # ── Tier-based deploy logic ──
            $DeployTier = "${{ needs.changes.outputs.server_b_tier }}"
            if ($DeployTier -eq "2") {
              Write-Output "🔧 Tier 2: Full image deploy"
              $GhToken = "${{ secrets.GITHUB_TOKEN }}"
              $GhActor = "${{ github.actor }}"
              $GhToken | docker login ghcr.io -u $GhActor --password-stdin
              docker compose -f deploy/docker-compose.server-b.yml pull
              docker compose -f deploy/docker-compose.server-b.yml up -d
              docker logout ghcr.io
            } else {
              Write-Output "🔄 Tier 1: Light restart (config refresh)"
              docker compose -f deploy/docker-compose.server-b.yml restart
            }

            # Restore/Import database from backup if it exists
            if (Test-Path C:\Windows\Temp\trades.db.bak) {
              Write-Output "📦 Restoring trades database into container..."
              try {
                docker cp C:\Windows\Temp\trades.db.bak tradingbot-execution:/app/data/trades.db
                docker compose -f deploy/docker-compose.server-b.yml restart
              } catch {
                Write-Output "⚠️ Failed to restore trades database: $_"
              }
            }

            echo "🔍 Testing Execution Server Health..."
            for ($i=1; $i -le 10; $i++) {
              try {
                $response = Invoke-RestMethod -Uri "http://localhost:5002/health" -Method Get
                if ($response.status -eq "healthy" -or $response.status -eq "ok") {
                  Write-Output "✅ Server B Healthy!"
                  if (Test-Path C:\Windows\Temp\trades.db.bak) {
                    Remove-Item C:\Windows\Temp\trades.db.bak -Force
                  }
                  exit 0
                }
              } catch {
                # Chờ dịch vụ boot
              }
              Start-Sleep -Seconds 2
            }
            Write-Error "❌ Server B Health Check Failed!"
            exit 1
          EOF
      - name: Post-Deploy Smoke Test (External Routing)
        id: smoke_b
        if: steps.deploy_b.outcome == 'success'
        run: |
          echo "🔌 Testing Tailscale network connectivity to Server B..."
          for i in {1..10}; do
            if curl -sf --connect-timeout 5 http://${{ secrets.SERVER_B_IP }}:5002/health; then
              echo "✅ Tailscale Network Smoke Test Passed!"
              exit 0
            fi
            echo "⏳ Retrying Tailscale connection..."
            sleep 3
          done
          echo "❌ Tailscale Network Smoke Test Failed!"
          exit 1

      - name: Rollback Server B (On Failure)
        if: failure() && steps.ssh_check_b.outputs.reachable == 'true'
        run: |
          echo "⚠️ Checking if rollback is needed..."
          ssh Administrator@${{ secrets.SERVER_B_IP }} << 'EOF'
            cd C:\opt\trading-bot
            if (-not (Test-Path .rollback_sha)) {
              Write-Output "⏭️ No rollback SHA — nothing to revert"
              exit 0
            }
            $CurrentSha = (git rev-parse HEAD).Trim()
            $RollbackSha = (Get-Content .rollback_sha -Raw).Trim()
            if ($CurrentSha -eq $RollbackSha) {
              Write-Output "⏭️ Code unchanged — rollback not needed"
              exit 0
            }
            Write-Output "🔄 Reverting Server B to $RollbackSha..."
            git checkout $RollbackSha
            docker compose -f deploy/docker-compose.server-b.yml up -d

            # Restore database backup if it exists
            if (Test-Path C:\Windows\Temp\trades.db.bak) {
              Write-Output "📦 Restoring trades database backup..."
              try {
                docker cp C:\Windows\Temp\trades.db.bak tradingbot-execution:/app/data/trades.db
                docker compose -f deploy/docker-compose.server-b.yml restart
                Remove-Item C:\Windows\Temp\trades.db.bak -Force
              } catch {
                Write-Output "⚠️ Failed to restore trades database: $_"
              }
            }
            Write-Output "✅ Rollback Server B completed"
          EOF

  # ── 3. PIPELINE REPORT & NOTIFICATION ─────────────────────────────────
  deploy-summary:
    name: Pipeline Summary & Telegram Alert
    needs: [changes, build-images, deploy-server-a, deploy-server-c, deploy-server-b]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Send Summary Alert
        env:
          BUILD_STATUS: ${{ needs.build-images.result }}
          SERVER_A_STATUS: ${{ needs.deploy-server-a.result }}
          SERVER_C_STATUS: ${{ needs.deploy-server-c.result }}
          SERVER_B_STATUS: ${{ needs.deploy-server-b.result }}
          TIER_A: ${{ needs.changes.outputs.server_a_tier }}
          TIER_B: ${{ needs.changes.outputs.server_b_tier }}
          TIER_C: ${{ needs.changes.outputs.server_c_tier }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          cat << 'EOF' > send_telegram.py
          import os
          import urllib.request
          import urllib.parse
          import json

          build_status = os.getenv('BUILD_STATUS', 'unknown')
          server_a_status = os.getenv('SERVER_A_STATUS', 'unknown')
          server_c_status = os.getenv('SERVER_C_STATUS', 'unknown')
          server_b_status = os.getenv('SERVER_B_STATUS', 'unknown')

          def get_emoji(status):
              if status == 'success':
                  return '🟢 SUCCESS'
              elif status == 'failure':
                  return '🔴 FAILED'
              elif status == 'cancelled':
                  return '⚪ CANCELLED'
              elif status == 'skipped':
                  return '🟡 SKIPPED'
              else:
                  return '❓ UNKNOWN'

          def tier_label(t):
              labels = {'0': 'T0 Skip', '1': 'T1 Pull', '2': 'T2 Full'}
              return labels.get(t, f'T{t}')

          tier_a = tier_label(os.getenv('TIER_A', '?'))
          tier_b = tier_label(os.getenv('TIER_B', '?'))
          tier_c = tier_label(os.getenv('TIER_C', '?'))

          emoji_build = get_emoji(build_status)
          emoji_a = get_emoji(server_a_status)
          emoji_c = get_emoji(server_c_status)
          emoji_b = get_emoji(server_b_status)

          overall_success = all(s in ['success', 'skipped'] for s in [build_status, server_a_status, server_c_status, server_b_status])
          pipeline_emoji = '✅' if overall_success else '🚨'
          pipeline_title = '<b>CI/CD Pipeline Deployment Report</b>'

          commit_sha = os.getenv('GITHUB_SHA', '')[:7]
          commit_msg = os.getenv('COMMIT_MESSAGE', 'N/A')
          commit_author = os.getenv('COMMIT_AUTHOR', 'N/A')
          repo = os.getenv('GITHUB_REPOSITORY', '')
          run_id = os.getenv('GITHUB_RUN_ID', '')

          message = f"""
          {pipeline_emoji} {pipeline_title}

          <b>Repository:</b> {repo}
          <b>Run:</b> <a href="https://github.com/{repo}/actions/runs/{run_id}">#{run_id}</a>
          <b>Commit:</b> <code>{commit_sha}</code> by {commit_author}
          <b>Message:</b> {commit_msg}

          <b>Stages Status:</b>
            • Build & Push: {emoji_build}
            • Server A (Gateway) [{tier_a}]: {emoji_a}
            • Server C (AI Core) [{tier_c}]: {emoji_c}
            • Server B (Execution) [{tier_b}]: {emoji_b}
          """

          bot_token = os.getenv('TELEGRAM_BOT_TOKEN')
          chat_id = os.getenv('TELEGRAM_CHAT_ID')

          if not bot_token or not chat_id:
              print("Telegram credentials missing, skipping alert.")
              exit(0)

          url = f"https://api.telegram.org/bot{bot_token}/sendMessage"
          data = urllib.parse.urlencode({
              'chat_id': chat_id,
              'text': message.strip(),
              'parse_mode': 'HTML',
              'disable_web_page_preview': 'true'
          }).encode('utf-8')

          req = urllib.request.Request(url, data=data, headers={'Content-Type': 'application/x-www-form-urlencoded'})
          try:
              with urllib.request.urlopen(req) as response:
                  print("Telegram alert sent successfully.")
          except Exception as e:
              print(f"Failed to send Telegram alert: {e}")
          EOF
          python send_telegram.py

      - name: Generate GHA Summary Dashboard
        env:
          BUILD_STATUS: ${{ needs.build-images.result }}
          SERVER_A_STATUS: ${{ needs.deploy-server-a.result }}
          SERVER_C_STATUS: ${{ needs.deploy-server-c.result }}
          SERVER_B_STATUS: ${{ needs.deploy-server-b.result }}
          TIER_A: ${{ needs.changes.outputs.server_a_tier }}
          TIER_B: ${{ needs.changes.outputs.server_b_tier }}
          TIER_C: ${{ needs.changes.outputs.server_c_tier }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          COMMIT_AUTHOR: ${{ github.event.head_commit.author.name }}
        run: |
          cat << 'EOF' > generate_summary.py
          import os

          build_status = os.getenv('BUILD_STATUS', 'unknown')
          server_a_status = os.getenv('SERVER_A_STATUS', 'unknown')
          server_c_status = os.getenv('SERVER_C_STATUS', 'unknown')
          server_b_status = os.getenv('SERVER_B_STATUS', 'unknown')

          def get_badge(status):
              if status == 'success':
                  return '🟢 Success'
              elif status == 'failure':
                  return '🔴 Failed'
              elif status == 'cancelled':
                  return '⚪ Cancelled'
              elif status == 'skipped':
                  return '🟡 Skipped'
              else:
                  return '❓ Unknown'

          badge_build = get_badge(build_status)
          badge_a = get_badge(server_a_status)
          badge_c = get_badge(server_c_status)
          badge_b = get_badge(server_b_status)

          def tier_label(t):
              labels = {'0': 'T0 Skip', '1': 'T1 Pull', '2': 'T2 Full'}
              return labels.get(t, f'T{t}')

          tier_a = tier_label(os.getenv('TIER_A', '?'))
          tier_b = tier_label(os.getenv('TIER_B', '?'))
          tier_c = tier_label(os.getenv('TIER_C', '?'))

          overall_success = all(s in ['success', 'skipped'] for s in [build_status, server_a_status, server_c_status, server_b_status])
          summary_emoji = '✅' if overall_success else '🚨'
          summary_title = 'Production Deployment Summary'

          commit_sha = os.getenv('GITHUB_SHA', '')[:7]
          commit_msg = os.getenv('COMMIT_MESSAGE', 'N/A')
          commit_author = os.getenv('COMMIT_AUTHOR', 'N/A')
          repo = os.getenv('GITHUB_REPOSITORY', '')
          run_id = os.getenv('GITHUB_RUN_ID', '')

          summary_content = f"""# {summary_emoji} {summary_title}

          ## Pipeline Info
          - **Repository**: {repo}
          - **Workflow Run**: [#{run_id}](https://github.com/{repo}/actions/runs/{run_id})
          - **Commit**: `{commit_sha}` (Author: {commit_author})
          - **Commit Message**: *{commit_msg}*

          ## Deployment Stages Status
          | Stage | Status | Description |
          | :--- | :--- | :--- |
          | **Build & Push Images** | {badge_build} | GHA build layer and scan with Trivy |
          | **Server A (Gateway)** [{tier_a}] | {badge_a} | VBS Gateway deploy & DB safe-gate |
          | **Server C (AI Core)** [{tier_c}] | {badge_c} | ChromaDB and Analyzer pull & check |
          | **Server B (Execution)** [{tier_b}] | {badge_b} | Windows host pull & fallback restore |

          ## Security Hardening Details
          - **Vulnerability Scanner**: Trivy Enforcement (`severity: CRITICAL`)
          - **Network Validation**: External Tailscale Network Smoke Tests
          - **Safe-Gate Backup**: Auto-Backup and import SQLite databases for Server A & Server B
          """

          summary_file = os.getenv('GITHUB_STEP_SUMMARY')
          if summary_file:
              with open(summary_file, 'w', encoding='utf-8') as f:
                  f.write(summary_content)
              print("GHA Step Summary generated successfully.")
          else:
              print("GITHUB_STEP_SUMMARY environment variable not found.")
          EOF
          python generate_summary.py
