# ╔══════════════════════════════════════════════════════════════════╗
# ║   CI PULL REQUEST PIPELINE                                      ║
# ║                                                                ║
# ║   Smart dispatch: detects change tier + branch pattern         ║
# ║   → maps to test_depth → delegates to _ci-gate.yml            ║
# ║                                                                ║
# ║   Branch strategy (Gold Council V1):                           ║
# ║     feat/*     → quick    (unit only, ~3 min)                  ║
# ║     fix/*      → standard (no E2E, ~8 min)                     ║
# ║     hotfix/*   → quick+safety (~5 min) + auto-deploy           ║
# ║     release/*  → full (~20 min)                                ║
# ║     main/dev   → standard (~8 min) via PR or push              ║
# ║                                                                ║
# ║   Change tiers:                                                ║
# ║     T0 docs/pine/scratch → skip (0 runners)                   ║
# ║     T1 config/.gitignore → lint only                           ║
# ║     T2 server/*.py       → depth by branch                     ║
# ║     T3 requirements/Docker → full override                     ║
# ╚══════════════════════════════════════════════════════════════════╝
name: CI Pull Request Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches:
      - main
      - develop
      - "feat/*"
      - "fix/*"
      - "hotfix/*"
      - "release/*"

# Cancel in-progress runs for same ref — prevents cache write races
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 0. SMART CHANGE CLASSIFICATION ─────────────────────────────────
  classify:
    name: "Classify Changes → Depth"
    runs-on: ubuntu-latest
    outputs:
      test_depth:     ${{ steps.depth.outputs.test_depth }}
      change_summary: ${{ steps.depth.outputs.change_summary }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2   # Need HEAD~1 for diff size check (hotfix guard)

      - name: Detect file changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            deps:
              - 'nerves/workers/trading/requirements*.txt'
              - 'Dockerfile'
              - 'vbs/Dockerfile'
            code:
              - 'nerves/workers/trading/**/*.py'
              - 'nerves/workers/trading/database.py'
              - 'vbs/**'
            config:
              - '.github/workflows/**'
              - 'nerves/workers/trading/.env.example'
              - 'deploy/**'
              - 'docker-compose*.yml'
            skip_only:
              - '*.md'
              - 'docs/**'
              - 'scratch/**'
              - 'reports/**'
              - 'pine/**'
              - 'memory/**'
              - 'logs/**'

      - name: Determine test depth
        id: depth
        run: |
          BRANCH="${GITHUB_REF_NAME}"
          DEPS="${{ steps.filter.outputs.deps }}"
          CODE="${{ steps.filter.outputs.code }}"
          CONFIG="${{ steps.filter.outputs.config }}"
          SKIP="${{ steps.filter.outputs.skip_only }}"
          DEPTH=""
          SUMMARY=""

          # ── Priority 1: Branch pattern (overrides tier) ──
          if [[ "$BRANCH" == hotfix/* ]]; then
            # Hotfix guard: large diff → upgrade to standard
            ADDED=$(git diff --shortstat HEAD~1 2>/dev/null \
              | grep -oP '\d+(?= insertion)' || echo "0")
            DELETED=$(git diff --shortstat HEAD~1 2>/dev/null \
              | grep -oP '\d+(?= deletion)' || echo "0")
            TOTAL=$((ADDED + DELETED))
            if [ "$TOTAL" -gt 300 ]; then
              DEPTH="standard"
              SUMMARY="hotfix/* but diff=$TOTAL lines >300 → upgraded to standard ⚠️"
            else
              DEPTH="quick"
              SUMMARY="hotfix/* ($TOTAL lines) → quick+safety, deploy enabled"
            fi

          elif [[ "$BRANCH" == release/* ]]; then
            DEPTH="full"
            SUMMARY="release/* → full suite (all stages)"

          # ── Priority 2: Change tier ──
          elif [ "$DEPS" = "true" ]; then
            DEPTH="full"
            SUMMARY="T3 dependency changes (requirements/Dockerfile) → full"

          elif [ "$CODE" = "true" ]; then
            if [[ "$BRANCH" == feat/* ]]; then
              DEPTH="quick"
              SUMMARY="T2 code on feat/* → quick tests"
            else
              # fix/*, develop, main — standard
              DEPTH="standard"
              SUMMARY="T2 code on $BRANCH → standard tests"
            fi

          elif [ "$CONFIG" = "true" ]; then
            DEPTH="lint"
            SUMMARY="T1 config/workflow changes → lint only"

          else
            # Only docs/pine/scratch/memory/logs changed
            DEPTH="skip"
            SUMMARY="T0 docs/pine/scratch → skip all (0 runners)"
          fi

          echo "test_depth=$DEPTH" >> $GITHUB_OUTPUT
          echo "change_summary=$SUMMARY" >> $GITHUB_OUTPUT

          echo "──────────────────────────────────"
          echo " Branch:  $BRANCH"
          echo " Depth:   $DEPTH"
          echo " Reason:  $SUMMARY"
          echo "──────────────────────────────────"

  # ── 1. CI GATE (Delegated to reusable workflow) ────────────────────
  ci-gate:
    name: "CI Gate [${{ needs.classify.outputs.test_depth }}]"
    needs: classify
    uses: ./.github/workflows/_ci-gate.yml
    with:
      test_depth: ${{ needs.classify.outputs.test_depth }}
      branch:     ${{ github.ref_name }}
