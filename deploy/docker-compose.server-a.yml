# ════════════════════════════════════════════════════════════════
# Server A (Gateway) — VBS Service
# 3-Server Pipeline: Phase 6.5
# ════════════════════════════════════════════════════════════════
# Host: Linux 1 CPU / 2GB — Cloudflare Tunnel + VBS
# Usage:
#   cd deploy && docker compose -f docker-compose.server-a.yml up -d
# ════════════════════════════════════════════════════════════════

version: "3.8"

services:
  vbs:
    image: ghcr.io/dinhvietdan88-commits/tradingbot-vbs:latest
    build:
      context: ../vbs
      dockerfile: Dockerfile
    container_name: tradingbot-vbs
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - VBS_MODE=true
      - HOST=0.0.0.0
      - PORT=5000
      - WEBHOOK_SECRET=${WEBHOOK_SECRET}
      - BUFFER_SECRET=${VPS_BUFFER_SECRET}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN}
      - TELEGRAM_CHAT_ID=${TELEGRAM_CHAT_ID}
      - DB_PATH=/app/data/signal_queue.db
    volumes:
      - vbs_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  vbs_data:
