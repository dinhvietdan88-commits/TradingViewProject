# Ruff configuration for TradingViewProject
# Matches CI pipeline settings (Angati Internal Security Scan)

[tool.ruff]
line-length = 88
target-version = "py311"

# server/ is a symlink → nerves/workers/trading/
src = ["nerves/workers/trading"]

[tool.ruff.lint]
# Match CI gate rules: E (pycodestyle errors), W (pycodestyle warnings),
# F (pyflakes), S (bandit/security), B (bugbear)
select = ["E", "W", "F", "S", "B"]

# Ignore rules that are too noisy for existing codebase
ignore = [
    "E501",   # Line too long — enforce gradually via pre-commit (warn, don't block)
    "S101",   # assert — used in tests
    "S603",   # subprocess without shell=True — intentional
    "S607",   # partial path for subprocess — controlled environment
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "S106"]  # Allow assert and hardcoded passwords in tests
"**/test_*.py" = ["S101", "S106"]
"scripts/**/*.py" = ["E402", "S101", "S104", "S106", "S110", "S311", "S608"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
omit = [
    "**/tests/**",
    "**/test_*.py",
    "**/smoke_test_*.py",
    "**/start_server.py",
    "**/script_reprocess.py",
    "**/telegram_bot.py",
    "**/vision.py",
    "**/charting.py",
    "**/main.py",
    "**/mcp_client.py",
    "**/exchanges*",
    "**/exchanges/**",
    "**/rag_mcp.py",
    "**/security/cli.py",
    "**/security/harness.py",
    "**/security/report.py",
    "**/security/__main__.py",
    "**/agy_harness.py",
    "**/telegram_commands.py",
    "**/sdk_client.py",
    "**/capture_daemon.py",
    "**/logging_config.py",
    "**/binance_client.py",
    "**/capture_client.py",
    "**/scripts/**",
    "**/workers/liveness_monitor.py",
    "**/workers/vps_consumer.py",
]
